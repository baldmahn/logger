<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal FIRE Dashboard - Live Rates & CAD Tracking</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #F9F6F0;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #7A7A7A;
            --accent-green: #8FA998;
            --accent-pink: #F2C4CE;
            --accent-wood: #D4B59E;
            --border-light: #EBEBEB;
            --cad-color: #a3a3a3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

        body { background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; display: flex; justify-content: center; }

        .container { max-width: 1050px; width: 100%; display: grid; grid-template-columns: 1fr 380px; gap: 30px; }
        .panel { background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 30px; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
        h2 { font-size: 1rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .rate-badge { font-size: 0.7rem; background: var(--bg-color); padding: 4px 8px; border-radius: 6px; color: var(--text-muted); border: 1px solid var(--border-light); }

        /* Top Metrics Grid */
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        .metric-box { padding: 15px; background: var(--bg-color); border-radius: 12px; border: 1px solid var(--border-light); }
        .metric-box label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        .sub-label { display: block; font-size: 0.65rem; color: var(--text-muted); margin-top: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        .input-wrapper { display: flex; align-items: baseline; gap: 8px; }
        .metric-box input { width: 100%; background: transparent; border: none; font-size: 1.5rem; font-weight: 600; color: var(--text-main); outline: none; border-bottom: 1px dashed transparent; transition: border-color 0.2s; }
        .metric-box input.sub-input { font-size: 1.1rem; padding: 2px 0; }
        .metric-box input:focus { border-bottom: 1px dashed var(--accent-green); }
        .cad-equiv { display: block; font-size: 0.75rem; color: var(--cad-color); margin-top: 4px; font-weight: 500; }

        /* Progress Bar */
        .progress-container { margin-top: 15px; background: var(--bg-color); padding: 15px; border-radius: 12px; border: 1px solid var(--border-light); }
        .progress-bar-bg { height: 12px; background: var(--border-light); border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--accent-green); width: 0%; transition: width 1s ease-out; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }

        /* Safe Balance */
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .highlight-box { text-align: center; padding: 20px; border-radius: 16px; color: #fff; display: flex; flex-direction: column; justify-content: center; }
        .highlight-box.spend { background: var(--accent-pink); }
        .highlight-box.invest { background: var(--accent-green); }
        .highlight-box h3 { font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: rgba(255,255,255,0.9); text-transform: uppercase; letter-spacing: 0.05em; }
        .highlight-box .amount { font-size: 1.8rem; font-weight: 600; }
        .highlight-box .cad-sub { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }

        /* Forms */
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        input[type="text"], input[type="number"]:not(.metric-box input), select { width: 100%; padding: 12px 15px; border: 1px solid var(--border-light); border-radius: 10px; background: var(--bg-color); font-size: 0.9rem; outline: none; color: var(--text-main); transition: border 0.2s; }
        input:focus, select:focus { border-color: var(--accent-wood); }
        button { width: 100%; padding: 14px; background: var(--accent-wood); color: white; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        
        .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border-light); margin-top: 10px; }
        .btn-secondary:hover { background: var(--bg-color); color: var(--text-main); }
        
        .btn-wipe { background: transparent; color: var(--text-muted); border: 1px dashed var(--border-light); margin-top: 20px; }
        .btn-wipe:hover { border-color: #ff6b6b; color: #ff6b6b; background: transparent; }

        /* Accordions (Transaction List) */
        .expense-list { margin-top: 20px; }
        .category-group { margin-bottom: 10px; border: 1px solid var(--border-light); border-radius: 12px; overflow: hidden; background: var(--bg-color); }
        .category-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; cursor: pointer; transition: background 0.2s; }
        .category-header:hover { background: #f0ebe1; }
        .category-title { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; }
        .category-type-indicator { width: 8px; height: 8px; border-radius: 50%; }
        .category-type-indicator.expense { background-color: var(--accent-pink); }
        .category-type-indicator.investment { background-color: var(--accent-green); }
        
        .category-total { text-align: right; }
        .category-total .dkk { font-weight: 600; font-size: 0.95rem; }
        .category-total .cad { font-size: 0.75rem; color: var(--cad-color); margin-top: 2px; }

        .category-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: var(--card-bg); }
        .category-group.active .category-content { max-height: 800px; }
        
        .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; }
        .expense-item:last-child { border-bottom: none; }
        .delete-btn { background: none; border: none; color: #ff6b6b; padding: 0 0 0 10px; font-size: 1.1rem; cursor: pointer; width: auto; }

        /* Bar Chart */
        .chart-container { display: flex; align-items: flex-end; gap: 15px; height: 150px; margin-top: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-light); }
        .chart-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; cursor: pointer; transition: opacity 0.2s; }
        .chart-col:hover { opacity: 0.6; }
        .chart-bar { width: 100%; background: var(--accent-pink); border-radius: 6px 6px 0 0; min-height: 2px; transition: height 0.5s; opacity: 0.8; pointer-events: none; }
        .chart-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 8px; pointer-events: none; }
        
        /* Granular Breakdown Panel */
        .breakdown-panel { margin-top: 20px; padding: 20px; background: var(--bg-color); border-radius: 12px; border: 1px solid var(--border-light); display: none; }
        .breakdown-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 600; font-size: 0.9rem; }
        .breakdown-close { cursor: pointer; color: var(--text-muted); font-size: 1.2rem; }
        .breakdown-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border-light); font-size: 0.85rem; }
        .breakdown-row:last-child { border-bottom: none; }

        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="main-column">
        <div class="panel">
            <div class="header-flex">
                <h2>Financial Baseline</h2>
                <div class="rate-badge" id="rate-display">Fetching Live Rate...</div>
            </div>
            <div class="metrics-grid">
                <div class="metric-box">
                    <label>Monthly Salary (DKK)</label>
                    <div class="input-wrapper">
                        <input type="number" id="inp-salary" onkeyup="updateSettings()" onchange="updateSettings()" step="100">
                    </div>
                    <span class="cad-equiv" id="cad-salary"></span>
                </div>
                <div class="metric-box">
                    <label>Target Savings / Mo (DKK)</label>
                    <div class="input-wrapper">
                        <input type="number" id="inp-target" onkeyup="updateSettings()" onchange="updateSettings()" step="100">
                    </div>
                    <span class="cad-equiv" id="cad-target"></span>
                </div>
            </div>

            <div class="balance-grid">
                <div class="highlight-box spend">
                    <h3>Safe to Spend</h3>
                    <div class="amount" id="dkk-safe">0 DKK</div>
                    <div class="cad-sub" id="cad-safe">$0 CAD</div>
                </div>
                <div class="highlight-box invest">
                    <h3>Invested This Month</h3>
                    <div class="amount" id="dkk-invest-mo">0 DKK</div>
                    <div class="cad-sub" id="cad-invest-mo">$0 CAD</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Log Transaction</h2>
            <div class="input-group">
                <select id="txn-type" onchange="toggleCategories()">
                    <option value="expense">Expense (-)</option>
                    <option value="investment">Investment (+)</option>
                </select>
                <select id="txn-cat"></select>
            </div>
            <div class="input-group">
                <input type="text" id="txn-desc" placeholder="Description (e.g., Groceries)">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="txn-amt" placeholder="Amount" style="flex: 1;">
                    <select id="txn-currency" style="width: 85px;">
                        <option value="DKK">DKK</option>
                        <option value="CAD">CAD</option>
                    </select>
                </div>
            </div>
            <button onclick="addTransaction()">Process Transaction</button>
            <button class="btn-secondary" onclick="importMobileTransactions()">Import Mobile JSON</button>
        </div>
        
        <div class="panel">
            <h2>Current Month Activity</h2>
            <div class="expense-list" id="transaction-list"></div>
        </div>
    </div>

    <div class="side-column">
        <div class="panel">
            <h2>FIRE Status & Net Worth</h2>
            <div class="metric-box" style="margin-bottom: 15px;">
                <label>FIRE Target (DKK)</label>
                <div class="input-wrapper">
                    <input type="number" id="inp-fire" onkeyup="updateSettings()" onchange="updateSettings()" step="1000">
                </div>
                <span class="cad-equiv" id="cad-fire"></span>
            </div>
            
            <div class="metric-box" style="margin-bottom: 15px;">
                <label>Base Existing Investments (DKK)</label>
                
                <span class="sub-label">Checking</span>
                <div class="input-wrapper">
                    <input type="number" class="sub-input" id="inp-base-checking" onkeyup="updateSettings()" onchange="updateSettings()" step="100">
                </div>

                <span class="sub-label">Brokerage</span>
                <div class="input-wrapper">
                    <input type="number" class="sub-input" id="inp-base-brokerage" onkeyup="updateSettings()" onchange="updateSettings()" step="100">
                </div>
                
                <span class="sub-label">ASK</span>
                <div class="input-wrapper">
                    <input type="number" class="sub-input" id="inp-base-ask" onkeyup="updateSettings()" onchange="updateSettings()" step="100">
                </div>
                
                <span class="sub-label">Pension</span>
                <div class="input-wrapper">
                    <input type="number" class="sub-input" id="inp-base-pension" onkeyup="updateSettings()" onchange="updateSettings()" step="100">
                </div>

                <div style="margin-top: 15px; padding-top: 12px; border-top: 1px dashed var(--border-light);">
                    <div style="font-size: 0.8rem; font-weight: 600;">Total Base: <span id="total-base-dkk"></span></div>
                    <span class="cad-equiv" id="cad-base-invest"></span>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-labels">
                    <span>Current Net Worth</span>
                    <strong style="color: var(--text-main)" id="total-nw-dkk">0 DKK</strong>
                </div>
                <div class="progress-labels" style="margin-top:2px;">
                    <span class="cad-equiv" id="total-nw-cad" style="margin:0;"></span>
                    <span id="fire-percent" style="font-weight:600; color:var(--accent-green);">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-fill" id="fire-fill"></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Burn Rate Trends (Last 6 Months)</h2>
            <div class="chart-container" id="trend-chart"></div>
            
            <div class="breakdown-panel" id="breakdown-panel">
                <div class="breakdown-header">
                    <span id="breakdown-title">Month Breakdown</span>
                    <span class="breakdown-close" onclick="closeBreakdown()">×</span>
                </div>
                <div id="breakdown-content"></div>
            </div>
        </div>

        <button class="btn-wipe" onclick="wipeAllData()">Wipe All Data</button>
    </div>
</div>

<script>
    let EXCHANGE_RATE = 0.215; 
    
    async function fetchLiveRate() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/DKK');
            const data = await response.json();
            if (data && data.rates && data.rates.CAD) {
                EXCHANGE_RATE = data.rates.CAD;
                document.getElementById('rate-display').innerText = `Live Rate: 1 DKK = ${EXCHANGE_RATE.toFixed(4)} CAD`;
                render(); 
            }
        } catch (error) {
            console.error("Could not fetch live rate. Falling back to default.", error);
            document.getElementById('rate-display').innerText = `Fallback Rate: 1 DKK = ${EXCHANGE_RATE} CAD`;
        }
    }
    
    fetchLiveRate();

    const EXPENSE_CATS = ['Rent', 'Groceries', 'Food', 'Misc', 'Vacation', 'Emergency'];
    const INVEST_CATS = ['Brokerage', 'ASK', 'Pension'];

    const defaultData = {
        salary: 41800, 
        targetSavings: 14000, 
        fireTarget: 4650000, 
        baseInvestments: { Checking: 0, Brokerage: 0, ASK: 0, Pension: 0 }, 
        transactions: []
    };

    let db = JSON.parse(localStorage.getItem('dualCurrencyFireDB2')) || defaultData;
    
    db = { ...defaultData, ...db };
    if (typeof db.baseInvestments === 'number') {
        db.baseInvestments = { Checking: 0, Brokerage: db.baseInvestments, ASK: 0, Pension: 0 };
    } else if (db.baseInvestments.Checking === undefined) {
        db.baseInvestments.Checking = 0; 
    }

    const fmtDKK = (num) => num.toLocaleString('da-DK', { maximumFractionDigits: 0 }) + ' kr.';
    const fmtCAD = (num) => '$' + (num * EXCHANGE_RATE).toLocaleString('en-CA', { maximumFractionDigits: 0 }) + ' CAD';
    
    function toggleCategories() {
        const type = document.getElementById('txn-type').value;
        const catSelect = document.getElementById('txn-cat');
        const options = type === 'expense' ? EXPENSE_CATS : INVEST_CATS;
        catSelect.innerHTML = options.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function updateSettings() {
        db.salary = parseFloat(document.getElementById('inp-salary').value) || 0;
        db.targetSavings = parseFloat(document.getElementById('inp-target').value) || 0;
        db.fireTarget = parseFloat(document.getElementById('inp-fire').value) || 0;
        
        db.baseInvestments.Checking = parseFloat(document.getElementById('inp-base-checking').value) || 0;
        db.baseInvestments.Brokerage = parseFloat(document.getElementById('inp-base-brokerage').value) || 0;
        db.baseInvestments.ASK = parseFloat(document.getElementById('inp-base-ask').value) || 0;
        db.baseInvestments.Pension = parseFloat(document.getElementById('inp-base-pension').value) || 0;
        
        const totalBase = db.baseInvestments.Checking + db.baseInvestments.Brokerage + db.baseInvestments.ASK + db.baseInvestments.Pension;
        
        document.getElementById('cad-salary').innerText = fmtCAD(db.salary);
        document.getElementById('cad-target').innerText = fmtCAD(db.targetSavings);
        document.getElementById('cad-fire').innerText = fmtCAD(db.fireTarget);
        
        document.getElementById('total-base-dkk').innerText = fmtDKK(totalBase);
        document.getElementById('cad-base-invest').innerText = fmtCAD(totalBase);
        
        saveData();
    }

    function addTransaction() {
        const type = document.getElementById('txn-type').value;
        const descBase = document.getElementById('txn-desc').value.trim() || 'Misc';
        const rawAmt = parseFloat(document.getElementById('txn-amt').value);
        const currency = document.getElementById('txn-currency').value;
        const cat = document.getElementById('txn-cat').value;

        if (isNaN(rawAmt) || rawAmt <= 0) return;

        let amt = rawAmt;
        let desc = descBase;
        if (currency === 'CAD') {
            amt = rawAmt / EXCHANGE_RATE;
            desc = `${descBase} (${rawAmt.toFixed(2)} CAD)`;
        }

        const now = new Date();
        const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        db.transactions.unshift({ id: Date.now(), type, desc, amt, cat, date: now.toLocaleDateString(), monthKey });

        document.getElementById('txn-desc').value = '';
        document.getElementById('txn-amt').value = '';
        saveData();
    }
    
    function importMobileTransactions() {
        const rawData = prompt("Paste your mobile JSON string here:");
        if (!rawData) return;
        
        try {
            const importedTxns = JSON.parse(rawData);
            if (Array.isArray(importedTxns)) {
                db.transactions = [...importedTxns, ...db.transactions];
                saveData();
                alert(`Successfully imported ${importedTxns.length} transactions!`);
            }
        } catch(e) {
            alert("Invalid JSON format.");
        }
    }

    function deleteTransaction(id) {
        db.transactions = db.transactions.filter(t => t.id !== id);
        saveData();
    }

    function wipeAllData() {
        if (confirm("CRITICAL WARNING: This will permanently delete all your financial data, transactions, and settings. Are you absolutely sure?")) {
            if (confirm("LAST CHANCE: There is no undo. Click OK to proceed.")) {
                localStorage.removeItem('dualCurrencyFireDB2');
                location.reload();
            }
        }
    }

    function toggleAccordion(el) {
        el.parentElement.classList.toggle('active');
    }

    function showBreakdown(monthKey) {
        const panel = document.getElementById('breakdown-panel');
        const title = document.getElementById('breakdown-title');
        const content = document.getElementById('breakdown-content');
        
        const monthTxns = db.transactions.filter(t => t.monthKey === monthKey && t.type === 'expense');
        
        if (monthTxns.length === 0) {
            content.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-muted);">No expenses recorded.</div>';
        } else {
            const grouped = {};
            let total = 0;
            monthTxns.forEach(t => {
                if(!grouped[t.cat]) grouped[t.cat] = { total: 0, items: [] };
                grouped[t.cat].total += t.amt;
                grouped[t.cat].items.push(t);
                total += t.amt;
            });

            let html = Object.keys(grouped).sort().map(cat => {
                const group = grouped[cat];
                return `
                <div class="category-group" style="background: var(--card-bg);">
                    <div class="category-header" onclick="toggleAccordion(this)" style="padding: 10px 15px;">
                        <div class="category-title" style="font-size: 0.85rem;">
                            <div class="category-type-indicator expense"></div>
                            ${cat}
                        </div>
                        <div class="category-total">
                            <div class="dkk" style="font-size: 0.85rem;">${fmtDKK(group.total)}</div>
                            <div class="cad" style="font-size: 0.65rem;">${fmtCAD(group.total)}</div>
                        </div>
                    </div>
                    <div class="category-content" style="background: var(--bg-color);">
                        ${group.items.map(t => `
                            <div class="expense-item" style="padding: 8px 15px; font-size: 0.8rem;">
                                <span style="color:var(--text-muted)">${t.desc}</span>
                                <div style="text-align:right">
                                    <div style="font-weight:500;">${fmtDKK(t.amt)}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }).join('');
            
            html += `<div class="breakdown-row" style="margin-top:15px; padding-top:12px; border-top:1px solid var(--text-muted); border-bottom:none; font-weight:600; font-size:0.95rem;">
                        <span>Total Spent</span>
                        <span>${fmtDKK(total)}</span>
                     </div>`;
                     
            content.innerHTML = html;
        }
        
        title.innerText = `Breakdown: ${monthKey}`;
        panel.style.display = 'block';
    }

    function closeBreakdown() {
        document.getElementById('breakdown-panel').style.display = 'none';
    }

    function saveData() {
        localStorage.setItem('dualCurrencyFireDB2', JSON.stringify(db));
        render();
    }

    function render() {
        if(document.activeElement.id !== 'inp-salary') document.getElementById('inp-salary').value = db.salary;
        if(document.activeElement.id !== 'inp-target') document.getElementById('inp-target').value = db.targetSavings;
        if(document.activeElement.id !== 'inp-fire') document.getElementById('inp-fire').value = db.fireTarget;
        
        if(document.activeElement.id !== 'inp-base-checking') document.getElementById('inp-base-checking').value = db.baseInvestments.Checking || 0;
        if(document.activeElement.id !== 'inp-base-brokerage') document.getElementById('inp-base-brokerage').value = db.baseInvestments.Brokerage;
        if(document.activeElement.id !== 'inp-base-ask') document.getElementById('inp-base-ask').value = db.baseInvestments.ASK;
        if(document.activeElement.id !== 'inp-base-pension') document.getElementById('inp-base-pension').value = db.baseInvestments.Pension;
        
        const totalBase = (db.baseInvestments.Checking || 0) + db.baseInvestments.Brokerage + db.baseInvestments.ASK + db.baseInvestments.Pension;

        document.getElementById('cad-salary').innerText = fmtCAD(db.salary);
        document.getElementById('cad-target').innerText = fmtCAD(db.targetSavings);
        document.getElementById('cad-fire').innerText = fmtCAD(db.fireTarget);
        
        document.getElementById('total-base-dkk').innerText = fmtDKK(totalBase);
        document.getElementById('cad-base-invest').innerText = fmtCAD(totalBase);

        const now = new Date();
        const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        
        let currentMonthSpent = 0;
        let currentMonthInvested = 0;
        let lifetimeInvestedFlow = 0;
        
        const groupedCurrent = {}; 
        const expenseTrends = {};
        
        db.transactions.forEach(t => {
            if (t.type === 'expense') {
                expenseTrends[t.monthKey] = (expenseTrends[t.monthKey] || 0) + t.amt;
                if (t.monthKey === currentMonthKey) {
                    currentMonthSpent += t.amt;
                    if(!groupedCurrent[t.cat]) groupedCurrent[t.cat] = { type: 'expense', total: 0, items: [] };
                    groupedCurrent[t.cat].total += t.amt;
                    groupedCurrent[t.cat].items.push(t);
                }
            } else if (t.type === 'investment') {
                lifetimeInvestedFlow += t.amt;
                if (t.monthKey === currentMonthKey) {
                    currentMonthInvested += t.amt;
                    if(!groupedCurrent[t.cat]) groupedCurrent[t.cat] = { type: 'investment', total: 0, items: [] };
                    groupedCurrent[t.cat].total += t.amt;
                    groupedCurrent[t.cat].items.push(t);
                }
            }
        });

        // Balances
        const safeBalance = db.salary - db.targetSavings - currentMonthSpent;
        document.getElementById('dkk-safe').innerText = fmtDKK(safeBalance);
        document.getElementById('cad-safe').innerText = fmtCAD(safeBalance);
        
        document.getElementById('dkk-invest-mo').innerText = fmtDKK(currentMonthInvested);
        document.getElementById('cad-invest-mo').innerText = fmtCAD(currentMonthInvested);

        // Transaction Accordions
        const listEl = document.getElementById('transaction-list');
        const categories = Object.keys(groupedCurrent).sort();
        
        if (categories.length === 0) {
            listEl.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem;">No activity logged this month.</div>';
        } else {
            listEl.innerHTML = categories.map(cat => {
                const group = groupedCurrent[cat];
                return `
                <div class="category-group">
                    <div class="category-header" onclick="toggleAccordion(this)">
                        <div class="category-title">
                            <div class="category-type-indicator ${group.type}"></div>
                            ${cat}
                        </div>
                        <div class="category-total">
                            <div class="dkk">${fmtDKK(group.total)}</div>
                            <div class="cad">${fmtCAD(group.total)}</div>
                        </div>
                    </div>
                    <div class="category-content">
                        ${group.items.map(t => `
                            <div class="expense-item">
                                <span style="color:var(--text-muted)">${t.desc}</span>
                                <div style="display:flex; align-items:center;">
                                    <div style="text-align:right">
                                        <div style="font-weight:500;">${fmtDKK(t.amt)}</div>
                                        <div style="font-size:0.7rem; color:var(--cad-color);">${fmtCAD(t.amt)}</div>
                                    </div>
                                    <button class="delete-btn" onclick="deleteTransaction(${t.id})">×</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        // FIRE Progress Tracking
        const totalNetWorth = totalBase + lifetimeInvestedFlow;
        document.getElementById('total-nw-dkk').innerText = fmtDKK(totalNetWorth);
        document.getElementById('total-nw-cad').innerText = fmtCAD(totalNetWorth);

        const fireRatio = db.fireTarget > 0 ? (totalNetWorth / db.fireTarget) * 100 : 0;
        const cappedRatio = Math.min(fireRatio, 100);
        document.getElementById('fire-fill').style.width = `${cappedRatio}%`;
        document.getElementById('fire-percent').innerText = `${cappedRatio.toFixed(1)}%`;

        // Trend Chart
        const monthKeys = [];
        for (let i = 5; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            monthKeys.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
        }

        let maxSpend = Math.max(...monthKeys.map(k => expenseTrends[k] || 0));
        if (maxSpend === 0) maxSpend = 1;

        document.getElementById('trend-chart').innerHTML = monthKeys.map(k => {
            const amt = expenseTrends[k] || 0;
            const height = (amt / maxSpend) * 100;
            const label = k.split('-')[1];
            
            return `
                <div class="chart-col" title="Click to view breakdown" onclick="showBreakdown('${k}')">
                    <div class="chart-bar" style="height: ${height}%;"></div>
                    <div class="chart-label">${label}</div>
                </div>
            `;
        }).join('');
    }

    toggleCategories(); 
    render();
</script>
</body>
</html>
