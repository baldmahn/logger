<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FIRE Mobile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        :root {
            --bg-color: #F9F6F0;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #7A7A7A;
            --accent-green: #8FA998;
            --accent-pink: #F2C4CE;
            --border-light: #EBEBEB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
        .header h1 { font-size: 1.2rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
        .rate-display { font-size: 0.75rem; color: var(--text-muted); }
        
        /* Navigation Tabs */
        .tab-bar { display: flex; margin-bottom: 20px; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-light); }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; background: transparent; border: none; transition: background 0.2s; }
        .tab-btn.active { background: var(--accent-green); color: white; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .panel { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; color: #7A7A7A; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        
        input[type="text"], input[type="number"], select { 
            width: 100%; padding: 15px; border: 1px solid var(--border-light); 
            border-radius: 12px; background: var(--bg-color); font-size: 1rem; 
            outline: none; color: var(--text-main); 
        }
        input:focus, select:focus { border-color: var(--accent-green); }

        .btn-large { width: 100%; padding: 18px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--accent-green); color: white; }
        .btn-secondary { background: transparent; color: #7A7A7A; border: 1px solid var(--border-light); margin-top: 15px; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: white; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
        
        .queue-status { text-align: center; font-size: 0.8rem; color: #7A7A7A; margin-top: 10px; }
        
        .convert-icon { text-align: center; font-size: 1.5rem; color: var(--border-light); margin: -5px 0 10px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>FIRE Mobile</h1>
        <div class="rate-display" id="mobile-rate-display">Fetching live rate...</div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tab-log" onclick="switchTab('log')">Logger</button>
        <button class="tab-btn" id="tab-convert" onclick="switchTab('convert')">Converter</button>
    </div>

    <!-- VIEW 1: LOGGER -->
    <div id="view-log" class="view-section active">
        <div class="panel">
            <div class="input-group">
                <label>Type</label>
                <select id="txn-type" onchange="updateCategories()">
                    <option value="expense">Expense (-)</option>
                    <option value="investment">Investment (+)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select id="txn-cat"></select>
            </div>

            <div class="input-group">
                <label>Amount</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="txn-amt" inputmode="decimal" placeholder="0" style="flex: 1;">
                    <select id="txn-currency" style="width: 85px;">
                        <option value="DKK">DKK</option>
                        <option value="CAD">CAD</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Description</label>
                <input type="text" id="txn-desc" placeholder="Brief note">
            </div>

            <button class="btn-large btn-primary" onclick="logTransaction()">Save Transaction</button>
        </div>

        <div class="queue-status" id="queue-count">0 pending transactions</div>
        <button class="btn-large btn-secondary" onclick="exportQueue()">Export & Clear Queue</button>
    </div>

    <!-- VIEW 2: CONVERTER -->
    <div id="view-convert" class="view-section">
        <div class="panel">
            <div class="input-group">
                <label>Danish Krone (DKK)</label>
                <input type="number" id="conv-dkk" inputmode="decimal" placeholder="0" oninput="convertCurrency('DKK')">
            </div>
            
            <div class="convert-icon">↕</div>
            
            <div class="input-group">
                <label>Canadian Dollar (CAD)</label>
                <input type="number" id="conv-cad" inputmode="decimal" placeholder="0" oninput="convertCurrency('CAD')">
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Saved!</div>

<script>
    let EXCHANGE_RATE = 0.215; 
    
    async function fetchLiveRate() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/DKK');
            const data = await response.json();
            if (data && data.rates && data.rates.CAD) {
                EXCHANGE_RATE = data.rates.CAD;
                document.getElementById('mobile-rate-display').innerText = `1 DKK = ${EXCHANGE_RATE.toFixed(4)} CAD`;
                convertCurrency('DKK'); // Trigger update if converter tab has data
            }
        } catch (error) {
            document.getElementById('mobile-rate-display').innerText = `Fallback Rate: 1 DKK = ${EXCHANGE_RATE} CAD`;
        }
    }
    
    fetchLiveRate();

    const EXPENSE_CATS = ['Rent', 'Groceries', 'Food', 'Misc', 'Vacation', 'Emergency'];
    const INVEST_CATS = ['Brokerage', 'ASK', 'Pension'];
    
    let queue = JSON.parse(localStorage.getItem('fireMobileQueue')) || [];
    updateQueueCount();

    function switchTab(tabId) {
        document.getElementById('view-log').classList.remove('active');
        document.getElementById('view-convert').classList.remove('active');
        document.getElementById('tab-log').classList.remove('active');
        document.getElementById('tab-convert').classList.remove('active');
        
        document.getElementById(`view-${tabId}`).classList.add('active');
        document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function convertCurrency(source) {
        const dkkInput = document.getElementById('conv-dkk');
        const cadInput = document.getElementById('conv-cad');
        
        if (source === 'DKK') {
            const val = parseFloat(dkkInput.value);
            cadInput.value = isNaN(val) ? '' : (val * EXCHANGE_RATE).toFixed(2);
        } else {
            const val = parseFloat(cadInput.value);
            dkkInput.value = isNaN(val) ? '' : (val / EXCHANGE_RATE).toFixed(2);
        }
    }

    function updateCategories() {
        const type = document.getElementById('txn-type').value;
        const options = type === 'expense' ? EXPENSE_CATS : INVEST_CATS;
        document.getElementById('txn-cat').innerHTML = options.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function logTransaction() {
        const type = document.getElementById('txn-type').value;
        const descBase = document.getElementById('txn-desc').value.trim() || 'Misc';
        const rawAmt = parseFloat(document.getElementById('txn-amt').value);
        const currency = document.getElementById('txn-currency').value;
        const cat = document.getElementById('txn-cat').value;

        if (isNaN(rawAmt) || rawAmt <= 0) {
            alert("Please enter a valid amount.");
            return;
        }

        let amt = rawAmt;
        let desc = descBase;
        
        if (currency === 'CAD') {
            amt = rawAmt / EXCHANGE_RATE;
            desc = `${descBase} (${rawAmt.toFixed(2)} CAD)`;
        }

        const now = new Date();
        const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

        queue.push({
            id: Date.now(),
            type,
            desc,
            amt,
            cat,
            date: now.toLocaleDateString(),
            monthKey
        });

        localStorage.setItem('fireMobileQueue', JSON.stringify(queue));
        
        document.getElementById('txn-desc').value = '';
        document.getElementById('txn-amt').value = '';
        
        updateQueueCount();
        showToast("Transaction saved!");
    }

    function updateQueueCount() {
        document.getElementById('queue-count').innerText = `${queue.length} pending transaction${queue.length === 1 ? '' : 's'}`;
    }

    function exportQueue() {
        if (queue.length === 0) {
            alert("Queue is empty.");
            return;
        }
        const payload = JSON.stringify(queue);
        
        if (navigator.share) {
            const file = new File([payload], `FIRE_export_${Date.now()}.json`, { type: 'application/json' });
            navigator.share({ title: 'FIRE Transactions', files: [file] })
                .then(() => clearQueue())
                .catch(() => tryClipboardExport(payload));
        } else {
            tryClipboardExport(payload);
        }
    }

    function tryClipboardExport(payload) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(payload)
                .then(() => successAlert())
                .catch(() => legacyClipboardExport(payload));
        } else {
            legacyClipboardExport(payload);
        }
    }

    function legacyClipboardExport(payload) {
        try {
            const textArea = document.createElement("textarea");
            textArea.value = payload;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.select();
            
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            
            if (successful) {
                successAlert();
            } else {
                showManualCopyScreen(payload);
            }
        } catch (err) {
            showManualCopyScreen(payload);
        }
    }

    function showManualCopyScreen(payload) {
        const manualDiv = document.createElement("div");
        manualDiv.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:9999; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:15px;";
        manualDiv.innerHTML = `
            <h3 style="color:var(--text-main);">Manual Copy Required</h3>
            <p style="font-size:0.85rem; color:var(--text-muted);">Your device blocked automated copying. Please tap inside the box, select all, and copy.</p>
            <textarea style="width:100%; height:200px; padding:15px; border-radius:12px; border:1px solid var(--border-light); font-family:monospace; font-size:0.8rem;">${payload}</textarea>
            <button class="btn-large btn-primary" onclick="clearQueue(); this.parentElement.remove();">I Copied It - Clear Queue</button>
            <button class="btn-large btn-secondary" onclick="this.parentElement.remove();">Cancel</button>
        `;
        document.body.appendChild(manualDiv);
    }

    function successAlert() {
        alert("Raw JSON copied to clipboard. Paste this into your main dashboard.");
        clearQueue();
    }

    function clearQueue() {
        if(confirm("Did you successfully transfer the data? This will clear your mobile queue.")) {
            queue = [];
            localStorage.setItem('fireMobileQueue', JSON.stringify(queue));
            updateQueueCount();
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    updateCategories();
</script>
</body>
</html>
